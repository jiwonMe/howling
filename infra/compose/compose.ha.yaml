name: howling-ha

services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2025.8.3
    container_name: howling-ha
    environment:
      TZ: Asia/Seoul
    ports:
      - "8123:8123"
    volumes:
      - ha_config:/config
      - ./ha/configuration.yaml:/config/configuration.yaml:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/api/onboarding')",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 40s

volumes:
  ha_config:
