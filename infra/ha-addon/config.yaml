name: Howling Runtime
version: "0.1.0"
slug: howling_runtime
description: Howling local runtime. Same image as Docker, Supervisor HA proxy when SUPERVISOR_TOKEN is set.
url: https://github.com/howling
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 4000
homeassistant_api: true
hassio_api: true
map:
  - type: data
    read_only: false
ports:
  4000/tcp: 4000
options: {}
schema: {}
