<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Howling Core browser smoke</title>
    <!-- file:// 로 열면 모듈이 차단된다. smoke:browser HTTP URL을 사용한다. -->
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      const out = document.getElementById("out");

      const show = (value) => {
        out.textContent = value;
      };

      if (location.protocol === "file:") {
        show(
          [
            "file:// 에서는 ES 모듈을 불러올 수 없습니다.",
            "워크스페이스 루트에서 아래를 실행한 뒤 http URL을 여세요.",
            "",
            "pnpm --filter @howling/core build",
            "pnpm --filter @howling/core smoke:browser",
            "",
            "그다음 http://127.0.0.1:4173/examples/browser-smoke.html",
          ].join("\n"),
        );
      } else {
        const { createEngine, createOfficialRegistry, createDryRunDriver } = await import(
          "../dist/index.js"
        );

        const definition = {
          schemaVersion: 1,
          id: "browser-smoke",
          revision: "v1",
          entryNodeId: "input",
          nodes: [
            { id: "input", type: "core.input", version: 1, config: {}, inputs: {} },
            {
              id: "cond",
              type: "core.condition",
              version: 1,
              config: { operator: "gt" },
              inputs: {
                left: { kind: "output", nodeId: "input", output: "value", path: "/n" },
                right: { kind: "literal", value: 1 },
              },
            },
          ],
          edges: [
            {
              id: "e1",
              source: { nodeId: "input", port: "success" },
              target: { nodeId: "cond", port: "in" },
            },
          ],
        };

        const engine = createEngine({ registry: createOfficialRegistry() });
        const compiled = engine.compile(definition);
        if (!compiled.ok) {
          throw new Error(compiled.diagnostics.map((item) => item.message).join("\n"));
        }
        const started = engine.startRun(compiled.plan, { n: 3 }, {
          runId: "browser",
          mode: "dryRun",
          logicalTime: 0,
        });
        if (!started.ok) {
          throw new Error("start failed");
        }
        const result = engine.run(
          compiled.plan,
          started.transition.state,
          createDryRunDriver({ fixtures: [] }),
        );
        show(JSON.stringify({ status: result.status, outputs: result.state.outputs }, null, 2));
      }
    </script>
  </body>
</html>
